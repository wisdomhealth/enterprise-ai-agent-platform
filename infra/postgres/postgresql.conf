# Task 25 production recovery baseline. The selected PostgreSQL image must
# contain PostgreSQL 17, pgvector, and the pgBackRest command-line client.
listen_addresses = '*'
wal_level = replica
archive_mode = on
# The official postgres entrypoint performs a temporary bootstrap start/stop
# before a pgBackRest stanza can exist.  The first checked backup creates this
# marker immediately after stanza-create. From then on, archive-push failures
# propagate so WAL is never silently discarded.
archive_command = 'if test -f /var/lib/postgresql/data/.pgbackrest-archive-ready; then pgbackrest --stanza=platform archive-push %p; fi'
archive_timeout = 900
max_wal_senders = 10
wal_keep_size = '512MB'
