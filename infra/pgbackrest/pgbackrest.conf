[global]
repo1-type=s3
repo1-path=/enterprise-ai-agent-platform
repo1-bundle=y
repo1-block=y
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-full-type=time
repo1-retention-diff=7
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
start-fast=y
log-level-console=info

# Bucket, endpoint, region, TLS verification, access key, secret key, and the
# repository cipher passphrase are injected with PGBACKREST_REPO1_* variables.
# No repository credential belongs in this file.

[platform]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
