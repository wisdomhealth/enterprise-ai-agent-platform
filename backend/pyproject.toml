[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-platform-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.49,<1",
  "asyncpg>=0.30,<1",
  "authlib>=1.4,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<47",
  "fastapi>=0.115,<0.116",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-kms>=3.4,<4",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "openai>=1.66,<3",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.8,<3",
  "pypdf>=5.3,<7",
  "python-docx>=1.1,<2",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.1,<26",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "pytest-repeat>=0.9,<1",
  "reportlab>=4.3,<5",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]
